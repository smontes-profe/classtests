<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Saludo Interactivo</title>
</head>
<body>
    <h2>Saludo Interactivo</h2>
    <input id="nombre" placeholder="Ingresa tu nombre">
    <button id="saludar">Saludar</button>
    <div id="mensajes"></div>

    <script>
        // Evento click en el botón saludar
        document.getElementById("saludar").onclick = function() {
            // Obtener el nombre del input
            let nombre = document.getElementById("nombre").value.trim();
            
            // Validar que no esté vacío
            if (nombre === "") {
                alert("Por favor, ingresa tu nombre");
                return;
            }
            
            // Crear el mensaje de saludo
            let mensaje = "¡Hola " + nombre + "! Bienvenido/a.";
            
            // 1. Crear y agregar el mensaje al DOM
            let div = document.createElement("div");
            div.className = "mensaje";
            div.textContent = mensaje;
            document.getElementById("mensajes").appendChild(div);
            
            // 2. Mostrar alerta
            alert(mensaje);
            
            // 3. Abrir ventana hija
            let w = window.open("", "Bienvenida", "width=400,height=200");
            if (w) {
                w.document.write("<h1>" + mensaje + "</h1>");
                // Cerrar ventana después de 5 segundos con la función de después
                setTimeout(function() { 
                    w.close(); 
                }, 5000);
            }
            
            // 4. Eliminar mensaje del DOM después de 5 segundos
            setTimeout(function() {
                div.style.transition = "opacity 0.5s";
                div.style.opacity = "0";
                setTimeout(function() { 
                    div.remove(); 
                }, 500);
            }, 5000);
            
            // Limpiar el input
            document.getElementById("nombre").value = "";
        };

        // Permitir enviar con la tecla Enter
        document.getElementById("nombre").onkeypress = function(e) {
            if (e.key === "Enter") {
                document.getElementById("saludar").click();
            }
        };
    </script>
</body>
</html>
