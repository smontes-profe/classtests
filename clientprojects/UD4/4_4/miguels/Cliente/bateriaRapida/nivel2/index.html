<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poción peligrosa · Nivel 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="nivel2.js" defer></script>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 2rem 0;
    }
    .container {
      max-width: 600px;
    }
    .card {
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: none;
    }
    header {
      text-align: center;
      color: white;
      margin-bottom: 2rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .resultado-box {
      background-color: #f8f9fa;
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1.5rem;
      min-height: 120px;
    }
    .resultado-box h2 {
      font-size: 1.25rem;
      margin-bottom: 1rem;
      color: #495057;
    }
    .resultado-box p {
      margin-bottom: 0.5rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧙‍♂️ Poción peligrosa 🧪</h1>
      <p class="lead">Evaluador de amenazas mágicas</p>
    </header>

    <main>
      <div class="card">
        <div class="card-body p-4">
          <form id="form-hechizo">
            <div class="mb-3">
              <label for="nivelMagia" class="form-label">Nivel de magia (entero):</label>
              <input id="nivelMagia" name="nivelMagia" type="number" step="1" class="form-control" required />
            </div>

            <div class="mb-3">
              <label for="capa" class="form-label">Capa:</label>
              <select id="capa" name="capa" class="form-select" required>
                <option value="">Selecciona una capa...</option>
                <option value="invisible">🔮 Invisible</option>
                <option value="roja">🔴 Roja</option>
                <option value="negra">⚫ Negra</option>
              </select>
            </div>

            <button type="submit" id="btn-evaluar" class="btn btn-primary w-100 btn-lg">
              Evaluar amenaza
            </button>
          </form>

          <div class="resultado-box">
            <h2>📋 Resultado</h2>
            <p id="resultadoMagia" class="text-muted"></p>
            <p id="resultadoCapa" class="text-muted"></p>
            <p id="error" class="text-danger fw-bold"></p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
