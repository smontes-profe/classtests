<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiArma - Digital Artist</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Header -->
        <header class="main-header">
            <div class="logo-container">
                <img src="assets/images/logo.png" alt="MiArma Logo" class="logo">
                <span class="brand-name">MIARMA</span>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><button id="btn-gallery" class="nav-btn active">Galeria</button></li>
                    <li><button id="btn-video" class="nav-btn">Video</button></li>
                    <li><button id="btn-audio" class="nav-btn">Audio</button></li>
                </ul>
            </nav>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Gallery View (Default) -->
            <section id="gallery-view" class="view active">
                <div class="hero-wrapper">
                    <div class="hero-display">
                        <img id="main-hero-image" src="assets/images/hero.jpg" alt="Featured Work">
                        <div class="hero-overlay">
                            <h1>Explora Mundos</h1>
                            <p>Arte Digital & Paisajes</p>
                        </div>
                    </div>
                </div>
                <aside class="gallery-sidebar">
                    <h3>Trabajos Recientes</h3>
                    <div class="thumbnail-grid">
                        <div class="thumb-card active" data-full="assets/images/hero.jpg">
                            <img src="assets/images/hero.jpg" alt="Hero">
                            <span class="thumb-label">Hero Landscape</span>
                        </div>
                        <div class="thumb-card" data-full="assets/images/landscape2.jpg">
                            <img src="assets/images/landscape2.jpg" alt="Neon Heights">
                            <span class="thumb-label">Neon Heights</span>
                        </div>
                        <div class="thumb-card" data-full="assets/images/landscape3.jpg">
                            <img src="assets/images/landscape3.jpg" alt="Alien Terrain">
                            <span class="thumb-label">Alien Terrain</span>
                        </div>
                        <div class="thumb-card" data-full="assets/images/landscape4.jpg">
                            <img src="assets/images/landscape4.jpg" alt="Crimson Sky">
                            <span class="thumb-label">Crimson Sky</span>
                        </div>
                        <div class="thumb-card" data-full="assets/images/landscape5.jpg">
                            <img src="assets/images/landscape5.jpg" alt="Mystic Valley">
                            <span class="thumb-label">Mystic Valley</span>
                        </div>
                    </div>
                </aside>
            </section>

            <!-- Video View -->
            <section id="video-view" class="view hidden">
                <div class="video-full-container">
                    <video controls poster="assets/images/hero.jpg" id="main-video">
                        <source src="assets/video/broly.mp4" type="video/mp4">
                        Tu navegador no soporta video.
                    </video>
                    <div id="video-overlay" class="video-overlay">
                        <span class="material-icons play-icon">play_circle_filled</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="main-footer">
            <div class="footer-grid">
                <div class="footer-logo">
                    <!-- Removed Ma Logo as requested -->
                    <span class="company-name">MiArma Art Studios</span>
                </div>
                <div class="footer-info">
                    <h4>Contacto & Legal</h4>
                    <p>Madrid, España</p>
                    <p>info@miarma.art</p>
                    <div class="license-mini">
                        <a rel="license" href="http://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC
                            4.0</a>
                    </div>
                    <a href="credits.html" class="credits-link">Créditos de Recursos</a>
                    <div class="theme-switch-wrapper">
                        <button id="theme-toggle" class="theme-btn" aria-label="Toggle Theme">
                            <span class="material-icons">light_mode</span>
                        </button>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Audio Player (Floating) -->
        <div id="audio-player-container" class="audio-player hidden">
            <div class="audio-card">
                <div class="audio-info">
                    <span class="material-icons">music_note</span>
                    <span>Ambiente Sci-Fi</span>
                </div>
                <audio controls id="main-audio">
                    <source src="assets/audio/60Heaven.mp3" type="audio/mpeg">
                </audio>
                <button id="close-audio" class="close-icon"><span class="material-icons">close</span></button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
